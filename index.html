<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fff7f9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161016">
<title>Nous deux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Nunito:ital,wght@0,400..800;1,400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #e5457e; --rose-deep: #c2255c; --blush: #ffe1ec; --peach: #ffeadb;
    --bg: #fff7f9; --card: #ffffffbf; --text: #322029; --muted: #a28792; --field: #fff2f7;
    --edge: #ffffffb3; --ring: #e5457e22; --tint: #e5457e1a;
    --font-display: "Fraunces", ui-serif, Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --blush: #331627; --peach: #2e2018; --bg: #161016; --card: #241822bd;
      --text: #f7edf3; --muted: #b79dab; --field: #1f131d; --edge: #ffffff1f; --ring: #e5457e44; --tint: #e5457e2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; overflow-x: hidden; color: var(--text);
    font: 500 16px/1.55 "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(55rem 38rem at 8% -12%, var(--blush), transparent 62%),
      radial-gradient(45rem 32rem at 108% 112%, var(--peach), transparent 58%),
      var(--bg);
    background-attachment: fixed;
  }
  /* Deux halos doux qui dérivent en fond */
  body::before, body::after {
    content: ''; position: fixed; z-index: -1; border-radius: 50%;
    filter: blur(70px); opacity: .55; pointer-events: none;
  }
  body::before { width: 22rem; height: 22rem; top: -8rem; left: -6rem; background: var(--blush); animation: drift 16s ease-in-out infinite alternate; }
  body::after  { width: 26rem; height: 26rem; bottom: -10rem; right: -8rem; background: var(--peach); animation: drift 20s ease-in-out infinite alternate-reverse; }

  main { max-width: 30rem; margin: 0 auto; padding: 3rem 1.5rem 5.5rem; }
  h1 {
    margin: 0; text-align: center; color: var(--rose-deep);
    font: italic 700 clamp(2.4rem, 9vw, 2.9rem)/1.08 var(--font-display);
    letter-spacing: -.02em;
  }
  h1 span { display: inline-block; animation: beat 1.6s ease-in-out infinite; }
  .tagline { margin: .5rem 0 2.2rem; text-align: center; color: var(--muted); font-size: .95rem; }

  .card {
    background: var(--card); backdrop-filter: blur(16px) saturate(1.2);
    padding: 1.7rem 1.6rem; border-radius: 1.7rem; margin: 0 0 1rem;
    box-shadow:
      0 24px 50px -26px #c2255c40,
      0 1px 0 var(--edge) inset,
      0 0 0 1px var(--edge);
    animation: up .5s cubic-bezier(.2, .8, .3, 1) both;
  }
  .card + .card { animation-delay: .07s; }
  .card.actions { padding: 1rem 1rem .4rem; }
  .eyebrow {
    display: inline-block; margin: 0 0 .9rem; padding: .28rem .75rem; border-radius: 999px;
    background: var(--tint); color: var(--rose);
    font-size: .68rem; font-weight: 800; letter-spacing: .15em; text-transform: uppercase;
  }
  .question {
    margin: 0 0 1.35rem; text-wrap: balance;
    font: 500 1.5rem/1.32 var(--font-display); letter-spacing: -.01em;
  }
  .hint { color: var(--muted); font-size: .93rem; margin: 0 0 1rem; }

  textarea, input {
    width: 100%; padding: .95rem 1.1rem; font: inherit; color: inherit;
    background: var(--field); border: 1.5px solid var(--ring); border-radius: 1.15rem;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  textarea { resize: vertical; min-height: 7.5rem; }
  textarea:focus, input:focus { border-color: var(--rose); box-shadow: 0 0 0 4px var(--tint); }
  input.code-input { text-align: center; text-transform: uppercase; letter-spacing: .4em; font-size: 1.25rem; font-weight: 700; }

  button {
    display: block; width: 100%; margin-top: .8rem; padding: .95rem 1.2rem;
    font-family: inherit; font-size: .98rem; font-weight: 800; line-height: 1;
    color: #fff; cursor: pointer; border: 0; border-radius: 999px;
    background: linear-gradient(135deg, #ff7aa2, var(--rose) 55%, var(--rose-deep));
    box-shadow: 0 12px 26px -12px var(--rose-deep);
    transition: transform .15s, box-shadow .15s, opacity .2s, background .2s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 16px 30px -12px var(--rose-deep); }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: wait; transform: none; }
  button.ghost { background: none; box-shadow: none; color: var(--rose); transition: background .15s, transform .15s; }
  button.ghost:hover { background: var(--tint); }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }

  .code {
    margin: .9rem 0 1.2rem; text-align: center; color: var(--rose);
    font: 700 2.4rem/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .35em; text-indent: .35em;
    text-shadow: 0 6px 24px #e5457e55;
  }

  .label { margin: 1.1rem 0 .35rem; font-size: .76rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .label.me { text-align: right; }
  .bubble {
    width: fit-content; max-width: 88%; padding: .85rem 1.1rem; border-radius: 1.3rem;
    white-space: pre-wrap; overflow-wrap: anywhere; animation: up .4s cubic-bezier(.2, .8, .3, 1) both;
  }
  .bubble.mine {
    margin-left: auto; color: #fff;
    background: linear-gradient(135deg, #ff7aa2, var(--rose) 60%, var(--rose-deep));
    border-bottom-right-radius: .4rem;
    box-shadow: 0 12px 26px -14px var(--rose-deep);
  }
  .bubble.theirs { background: var(--field); border: 1px solid var(--edge); border-bottom-left-radius: .4rem; }
  .bubble.locked {
    background: none; border: 1.5px dashed var(--muted); color: var(--muted);
    font-style: italic; border-bottom-left-radius: .4rem;
  }
  .both { margin: 1.4rem 0 0; text-align: center; font: italic 600 1.05rem var(--font-display); color: var(--rose); }

  .toast {
    position: fixed; left: 50%; bottom: 1.6rem; transform: translateX(-50%);
    width: max-content; max-width: calc(100vw - 2.5rem);
    padding: .85rem 1.3rem; font-weight: 700; font-size: .95rem;
    background: var(--card); backdrop-filter: blur(16px) saturate(1.2); color: var(--text);
    border-radius: 999px; box-shadow: 0 18px 40px -18px #c2255c66, 0 0 0 1px var(--edge);
    animation: toast-up .35s cubic-bezier(.2, .8, .3, 1) both; z-index: 2; white-space: pre-wrap;
  }

  @keyframes toast-up { from { opacity: 0; transform: translate(-50%, 12px); } }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } }
  @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(4rem, 3rem) scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Nous deux <span aria-hidden="true">💞</span></h1>
  <p class="tagline">Une question par jour, rien que pour vous deux.</p>
  <div id="app"><p class="hint" style="text-align:center">Chargement…</p></div>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// Supabase > Project Settings > API Keys (la clé publishable/anon est publique, c'est normal)
const SUPABASE_URL = 'https://njvatmicnmekplpkvppd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_1A5R-PFEg8rN8lc5junI7Q_bbCIEbBB';

const QUESTIONS = [
  "Quel est ton meilleur souvenir avec moi ?",
  "Qu'est-ce qui t'a fait sourire aujourd'hui ?",
  "Où aimerais-tu qu'on parte en voyage ensemble ?",
  "Quelle petite chose je fais qui te fait plaisir ?",
  "Quel est ton plat préféré que je cuisine (ou devrais cuisiner) ?",
  "Qu'est-ce que tu as pensé la première fois que tu m'as vu·e ?",
  "Quelle chanson te fait penser à nous ?",
  "Quel rêve aimerais-tu réaliser dans les 5 prochaines années ?",
  "De quoi es-tu fier·e cette semaine ?",
  "Quel serait notre rendez-vous parfait ?",
  "Qu'est-ce qui te stresse en ce moment ?",
  "Quelle habitude aimerais-tu qu'on prenne ensemble ?",
  "Quel film devrait-on regarder ensemble ?",
  "Qu'est-ce que tu préfères dans notre relation ?",
  "Si on gagnait au loto demain, on fait quoi ?",
  "Quel moment de ton enfance te rend nostalgique ?",
  "Qu'est-ce que je pourrais faire pour t'aider cette semaine ?",
  "Quelle est la chose la plus drôle qu'on ait vécue ensemble ?",
  "Quelle qualité admires-tu chez moi ?",
  "Comment imagines-tu notre vie dans 10 ans ?",
  "Quel petit plaisir t'a manqué récemment ?",
  "Quelle est ta saison préférée et pourquoi ?",
  "Qu'est-ce que tu aimerais apprendre ?",
  "Quel compliment aimerais-tu entendre plus souvent ?",
  "Quel endroit te fait te sentir chez toi ?",
  "Quelle est ta plus grande peur ?",
  "Quel serait ton week-end idéal ?",
  "Qu'est-ce qui te rend heureux·se en ce moment ?",
  "Quelle tradition aimerais-tu qu'on crée tous les deux ?",
  "Qu'est-ce que tu voudrais me dire mais n'as jamais osé ?",
];

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');

// Mini helper DOM : les strings deviennent des text nodes → pas d'injection HTML
const h = (tag, props = {}, ...kids) => { const el = Object.assign(document.createElement(tag), props); el.append(...kids); return el; };
const show = (...els) => app.replaceChildren(...els);
const card = (...kids) => h('div', { className: 'card' }, ...kids);
const fail = (e) => show(card(h('p', { className: 'eyebrow' }, 'Oups'), h('p', {}, e.message), btn('Réessayer', main)));
const btn = (label, fn, className = '') => h('button', { className, onclick: async (e) => {
  e.target.disabled = true;
  try { await fn(); } finally { e.target.disabled = false; }
} }, label);
const share = (code) => navigator.share
  ? navigator.share({ text: `Rejoins-moi sur Nous deux 💞 Code : ${code}\n${location.href}` }).catch(() => {})
  : navigator.clipboard.writeText(code).then(() => alert('Code copié !'));

// Temps réel + alertes : un canal par couple, activé une fois appariés (voir listen())
let channel = null;   // canal Supabase Realtime
let current = null;   // état de la vue du jour { couple, user }, pour rafraîchir sans recharger
let flashTimer = null;

// Même formule que la question du jour, réutilisée pour les souvenirs
const questionFor = (day) => QUESTIONS[Math.floor(Date.parse(day) / 86400000) % QUESTIONS.length];

const toast = (msg) => {
  const t = h('div', { className: 'toast', role: 'status' }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), 4200);
};

// Prévenir même quand l'app est en fond : Notification si permission, sinon titre qui clignote
const alertes = (msg) => {
  navigator.vibrate?.([80, 40, 80]);
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    new Notification('Nous deux 💞', { body: msg });
  } else {
    toast(msg);
    if (document.hidden) flashTitle();
  }
};
const flashTitle = () => {
  if (flashTimer) return;
  let i = 0;
  flashTimer = setInterval(() => {
    document.title = (i++ % 2) ? '💞 Une réponse t\u2019attend' : 'Nous deux';
    if (i > 8) { clearInterval(flashTimer); flashTimer = null; document.title = 'Nous deux'; }
  }, 900);
};
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && flashTimer) { clearInterval(flashTimer); flashTimer = null; document.title = 'Nous deux'; }
});

function listen(couple, user) {
  if (channel) return;
  channel = sb.channel(`nous-deux-${couple.id}`)
    // Ton/ta partenaire pense à toi : bulle instantanée
    .on('broadcast', { event: 'nudge' }, () => alertes('Ton/ta partenaire pense à toi 💭'))
    // Le partenaire vient de répondre (RLS me masque encore sa réponse) : c'est mon tour
    .on('broadcast', { event: 'answered' }, () => {
      const ta = app.querySelector('textarea');
      if (document.activeElement === ta) return toast('Ton/ta partenaire a répondu 💞 Tu verras la mise à jour après l\u2019envoi');
      alertes('C\u2019est ton tour ! Ton/ta partenaire a répondu 💞');
      if (current) showToday(current.couple, current.user);
    })
    // Nouvelle réponse que je peux voir (j'ai répondu en premier) : dévoilement en direct
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'answers', filter: `couple_id=eq.${couple.id}` }, (payload) => {
      if (payload.new.user_id === user.id) return;
      if (document.hidden) alertes('Vos réponses du jour se sont dévoilées 💞');
      if (current) showToday(current.couple, current.user);
    })
    .subscribe();
}

async function main() {
  // ponytail: compte anonyme lié au navigateur (vider les données = perdre le couple). Passer à l'email OTP si besoin.
  const { data: { session } } = await sb.auth.getSession();
  let user = session?.user;
  if (!user) {
    const { data, error } = await sb.auth.signInAnonymously();
    if (error) return fail(error);
    user = data.user;
  }

  const { data: couples, error } = await sb.from('couples').select('*').limit(1);
  if (error) return fail(error);
  const couple = couples[0];

  if (!couple) return showPairing(user.id);
  if (!couple.b) return show(card(
    h('p', { className: 'eyebrow' }, 'Presque prêt'),
    h('p', { className: 'question' }, 'Envoie ce code à ton/ta partenaire'),
    h('p', { className: 'code' }, couple.code),
    btn('Partager le code', () => share(couple.code)),
    btn('J\'ai envoyé, actualiser', main, 'ghost'),
  ));
  listen(couple, user);
  showToday(couple, user);
}

function showPairing(me) {
  const input = h('input', { className: 'code-input', placeholder: 'ABC123', maxLength: 6, autocomplete: 'off', ariaLabel: 'Code du partenaire' });
  show(
    card(
      h('p', { className: 'eyebrow' }, 'Bienvenue'),
      h('p', { className: 'question' }, 'Une question par jour, rien que pour vous deux.'),
      h('p', { className: 'hint' }, 'Vous répondez chacun de votre côté, et la réponse de l\'autre se dévoile quand vous avez répondu.'),
      btn('Créer notre espace', async () => {
        const { error } = await sb.from('couples').insert({ a: me });
        error ? alert(error.message) : main();
      }),
    ),
    card(
      h('p', { className: 'eyebrow' }, 'Tu as reçu un code ?'),
      input,
      btn('Rejoindre', async () => {
        const { data, error } = await sb.rpc('join_couple', { c: input.value.trim() });
        if (error || !data) return alert(error?.message ?? 'Code invalide ou déjà utilisé');
        main();
      }),
    ),
  );
}

async function showToday(couple, user) {
  current = { couple, user };
  const me = user.id;
  const today = new Date().toISOString().slice(0, 10); // UTC, comme current_date côté Supabase
  const question = questionFor(today);
  const dateLabel = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });

  const { data: answers, error } = await sb.from('answers')
    .select('user_id, text').eq('couple_id', couple.id).eq('day', today);
  if (error) return fail(error);

  const mine = answers.find((a) => a.user_id === me);
  const theirs = answers.find((a) => a.user_id !== me);
  const head = [h('p', { className: 'eyebrow' }, dateLabel), h('p', { className: 'question' }, question)];

  const nudge = btn('Je pense à toi 💭', async () => {
    if (!channel) return toast('Recharge la page pour activer le temps réel');
    await channel.send({ type: 'broadcast', event: 'nudge', payload: { from: me } });
    toast('Envoyé 💞');
  }, 'ghost');
  const notifs = btn('Activer les notifications', async () => {
    if (!('Notification' in window)) return toast('Notifications non supportées par ce navigateur');
    const p = await Notification.requestPermission();
    toast(p === 'granted' ? 'Notifications activées 💞' : 'Notifications refusées');
  }, 'ghost');
  const souvenirs = btn('Nos souvenirs', () => { current = null; showHistory(couple, user); }, 'ghost');
  const actions = h('div', { className: 'card actions' }, nudge, notifs, souvenirs);

  // Un compte anonyme vit dans le navigateur : proposer un email pour sauver les réponses
  let emailCard = null;
  if (user.is_anonymous) {
    const emailInput = h('input', { type: 'email', placeholder: 'ton@email.fr', autocomplete: 'email', ariaLabel: 'Ton email' });
    emailCard = card(
      h('p', { className: 'eyebrow' }, 'Sécuriser vos souvenirs'),
      h('p', { className: 'hint' }, 'Ton compte est lié à ce navigateur : si ses données sont vidées, vos réponses partent avec. Ajoute un email pour les retrouver.'),
      emailInput,
      btn('Lier mon email', async () => {
        if (!emailInput.value.trim()) return emailInput.focus();
        const { error } = await sb.auth.updateUser({ email: emailInput.value.trim() });
        if (error) return alert(error.message);
        alert('Vérifie ta boîte mail pour confirmer 💞');
      }),
    );
  }

  if (!mine) {
    const ta = h('textarea', { placeholder: 'Écris ta réponse…', maxLength: 2000, ariaLabel: 'Ta réponse' });
    return show(
      card(
        ...head, ta,
        btn('Envoyer 💌', async () => {
          if (!ta.value.trim()) return ta.focus();
          const { error } = await sb.from('answers').insert({ couple_id: couple.id, text: ta.value.trim() });
          if (error) return alert(error.message);
          channel?.send({ type: 'broadcast', event: 'answered', payload: {} });
          main();
        }),
        h('p', { className: 'label' }, 'Ton/ta partenaire'),
        h('div', { className: 'bubble locked' }, '🔒 Sa réponse se dévoile quand tu as répondu'),
      ),
      actions, emailCard,
    );
  }

  show(
    card(
      ...head,
      h('p', { className: 'label me' }, 'Toi'),
      h('div', { className: 'bubble mine' }, mine.text),
      h('p', { className: 'label' }, 'Ton/ta partenaire'),
      theirs
        ? h('div', { className: 'bubble theirs' }, theirs.text)
        : h('div', { className: 'bubble locked' }, '⏳ Pas encore répondu…'),
      theirs ? h('p', { className: 'both' }, 'Vous avez répondu tous les deux 💞') : btn('Actualiser', () => showToday(couple, user), 'ghost'),
    ),
    actions, emailCard,
  );
}

async function showHistory(couple, user) {
  // La RLS ne renvoie que les jours où tu as répondu : leur réponse d'un jour sans la tienne reste secrète
  const { data, error } = await sb.from('answers')
    .select('user_id, day, text').eq('couple_id', couple.id)
    .order('day', { ascending: false }).limit(120);
  if (error) return fail(error);

  const days = [];
  for (const row of data) {
    let d = days.at(-1);
    if (!d || d.day !== row.day) { d = { day: row.day, mine: null, theirs: null }; days.push(d); }
    if (row.user_id === user.id) d.mine = row.text; else d.theirs = row.text;
  }

  const view = [card(
    h('p', { className: 'eyebrow' }, 'Nos souvenirs'),
    h('p', { className: 'hint' }, days.length ? `${days.length} jour${days.length > 1 ? 's' : ''} de réponses. Reviens aussi longtemps : tout reste ici.` : 'Pas encore de souvenirs — réponds à la question du jour !'),
    btn('Retour', () => showToday(couple, user), 'ghost'),
  )];
  for (const d of days) {
    const kids = [
      h('p', { className: 'eyebrow' }, new Date(d.day + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })),
      h('p', { className: 'question' }, questionFor(d.day)),
    ];
    if (d.mine) kids.push(h('p', { className: 'label me' }, 'Toi'), h('div', { className: 'bubble mine' }, d.mine));
    kids.push(h('p', { className: 'label' }, 'Ton/ta partenaire'));
    kids.push(d.theirs
      ? h('div', { className: 'bubble theirs' }, d.theirs)
      : h('div', { className: 'bubble locked' }, 'Pas de réponse ce jour-là'));
    view.push(card(...kids));
  }
  show(...view);
}

main().catch(fail);
</script>
</body>
</html>
